limit_req_zone $binary_remote_addr zone=expense_tracker_reads:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=expense_tracker_sensitive:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __API_FQDN__;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"error":"Too many requests. Please try again shortly.","code":"rate_limited"}';
    }

    location = /api/v0/login {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v0/register {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v0/checkEmail {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/api/v0/(auth/google/(exchange|register)|invitations/[^/]+)$ {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=expense_tracker_reads burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
