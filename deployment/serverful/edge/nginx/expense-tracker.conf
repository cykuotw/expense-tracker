limit_req_zone $binary_remote_addr zone=expense_tracker_reads:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=expense_tracker_sensitive:10m rate=1r/s;
map "$request_method:$uri" $expense_tracker_mutation_key {
    default "";
    ~^(POST|PUT|PATCH):/api/v0/(auth/refresh|logout|account(?:/password|/google/link)?|create_group|group(?:/[^/]+)?|group_members?|archive_group/[^/]+|create_expense|expense/[^/]+|delete_expense/[^/]+|settle_expense/[^/]+|settle_balance/[^/]+/[^/]+|invitations(?:/[^/]+/expire)?|admin/users/[^/]+/(status|role)|admin/invitations/[^/]+/expire)$ $binary_remote_addr;
}
limit_req_zone $expense_tracker_mutation_key zone=expense_tracker_mutations:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __API_FQDN__;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    limit_req_status 429;
    error_page 429 = @rate_limited;

    location @rate_limited {
        add_header Retry-After 60 always;
        default_type application/json;
        return 429 '{"error":"Too many requests. Please try again shortly.","code":"rate_limited"}';
    }

    location = /api/v0/login {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v0/register {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v0/checkEmail {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v0/userInfo {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/api/v0/(auth/google/(exchange|register)|invitations/[^/]+)$ {
        limit_req zone=expense_tracker_sensitive burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        limit_req zone=expense_tracker_mutations burst=10 nodelay;
        limit_req zone=expense_tracker_reads burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
